[workspace]
members = ["crates/sdt-save", "crates/sdt-editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aris Swift"]

[workspace.dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
